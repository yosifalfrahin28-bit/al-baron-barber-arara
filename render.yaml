services:
  - type: web
    name: al-baron-api
    runtime: node
    plan: free
    buildCommand: npm install --global pnpm@10.26.1 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-spec run codegen && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_AUTH_DIR
        value: /var/lib/al-baron/whatsapp-auth